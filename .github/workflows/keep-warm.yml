name: Check demo health

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-demo-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          URL="https://travel-planner-demo.onrender.com"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 90 "$URL/api/health" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "🟢 demo 实例在线"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::demo 预热失败（实例唤醒失败 / 正在部署 / 服务异常）"
          exit 1
