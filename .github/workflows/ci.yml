name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

      # 自包含：内部会启动桩 LLM + 隔离端口测试服务器，跑边界与故障注入
      - name: 端到端测试（边界 + 故障注入）
        run: npm test
