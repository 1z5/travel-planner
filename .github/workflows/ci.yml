name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支只保留最新一次运行：main 是高频直推（近 30 天 162 commits），
# 旧 run 的结论没有价值，取消它们能省 runner 分钟，也避免「排队很久才跑」。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 兜底：单测 + e2e + 构建正常约 5 分钟；卡死的 run 不应白占 runner 一整小时。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # Prisma 7 起 @prisma/client 不再有 postinstall，npm ci 不会生成 client，
      # 缺 .prisma/client 会让任何 import 了 store 的路由在运行时崩溃。
      # 必须显式生成（只读 schema，不连库）。
      - name: 生成 Prisma Client
        run: npx prisma generate

      - name: 依赖安全审计（高危阻断）
        run: npm audit --audit-level=high

      # `npm run lint` = ESLint（.js/.mjs 脚本）+ oxlint（TS/TSX，自解析、不依赖
      # TS 版本）串联。此前只有 ESLint 且对 .ts/.tsx 全部 ignore —— 所有
      # TS/TSX 从未被检查（P0-7）；oxlint 现在兜住这一层。
      - name: 代码检查（ESLint + oxlint）
        run: npm run lint

      - name: 格式检查（Prettier）
        run: npm run format:check

      - name: 类型检查
        run: npm run typecheck

      - name: 恢复 Next 构建缓存
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'lib/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: 生产构建
        run: npm run build

      # 自包含：内部会启动桩 LLM + 隔离端口测试服务器，跑边界与故障注入
      - name: 端到端测试（边界 + 故障注入）
        run: npm test

      # 组件测试（Vitest + RTL）：表单交互、提交载荷、PlanView 渲染。
      # 用 test:coverage 而不是 test:unit：vitest.config 里配置的覆盖率阈值
      # （lines/functions 50、branches 40）只在带 coverage 时生效——此前 CI
      # 跑的是 test:unit，阈值形同虚设。
      - name: 组件测试 + 覆盖率门禁（Vitest + RTL）
        run: npm run test:coverage

  # 密钥泄露扫描：代码里出现过真实 key / token 是商业化产品最致命的事故之一。
  # 用官方二进制（固定版本），不引入需要付费 license 的第三方 action。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks 需要完整历史才能扫到「曾经提交过又删掉」的密钥
      - name: 安装 Gitleaks（固定版本）
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: 扫描密钥泄露
        run: gitleaks detect --source . --redact --exit-code 1 --verbose

  # Postgres 路径契约：内存实现（默认）掩盖了「真实生产存储」的差异——
  # Plan 落库/分享页读回、revision 原子自增都只有连真库才验得到。
  # 本 job 起一个 postgres service，跑迁移基线后全量 e2e（run-tests 里
  # HAS_PG 为真时会追加 phaseP：Plan 持久化 + revision 递增；其余阶段的
  # 服务器显式 DATA_STORE=memory，与 PG 阶段隔离，不共享配额桶）。
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma Client
        run: npx prisma generate

      - name: 应用迁移基线（无迁移历史的库在这里就会暴露）
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/travel_planner_test

      - name: 端到端测试（含 Postgres 契约 phaseP）
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/travel_planner_test
          DATA_STORE: postgres
