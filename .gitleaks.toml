# Gitleaks 配置：CI 的 secret-scan job 使用。
#
# 目的：拦住「真实密钥被提交」这类事故，同时不把项目里**故意的占位符**
# 当成漏洞刷屏。误报太多会让人养成忽略 CI 的习惯，那比漏报更危险。

[extend]
useDefault = true

[[allowlists]]
description = "项目内已知占位符/示例值（非真实密钥）"
paths = [
  '''\.env\.example$''',
  '''DEPLOY\.md$''',
  '''lib/auth/session\.ts$''',
  '''scripts/check-env\.mjs$''',
  '''scripts/preflight\.mjs$''',
  '''scripts/run-tests\.mjs$''',
]
regexes = [
  '''在这里填你的key''',
  '''dev-only-insecure-secret''',
  '''sk-xxx''',
  '''stub-key''',
  '''stub-amap-key''',
]

# localStorage 键名常量（如 "tp.execution.v1"）被 generic-api-key 的
# 「= + 高熵字符串」规则误判：它不是密钥，是浏览器本地存储的命名空间。
#
# 为什么单独一条 allowlist：allowlist 的 regexes 默认匹配的是**密钥值**
# 而不是整行（第一版把 `STORAGE_KEY = "..."` 写进去因此没生效，CI 实测）。
# regexTarget = "match" 才对整段匹配文本生效；stopwords 再兜一层（值是固定
# 命名空间，按值放行也不会放过随机密钥）。不用整文件白名单——那会放过真泄漏。
[[allowlists]]
description = "localStorage 键名（tp.*.vN）被 generic-api-key 误判"
regexTarget = "match"
regexes = [
  '''STORAGE_KEY = "tp\.[a-z0-9.-]+"''',
]
stopwords = [
  "tp.execution.v1",
  "tp.wishlist.v1",
  "tp.recent-trips.v1",
  "tp.pending-job.v1",
  "tp.execution",
]
